name: Build and Deploy to Hostinger

on:
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Verify deploy artifacts
        run: |
          test -f dist/client/index.html
          test -f dist/client/.htaccess

      - name: Deploy via deploy.js (uses FTP and applies permission fixes)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          node scripts/deploy.js

      - name: Verify site is live
        run: |
          for domain in scholarscafe.com www.scholarscafe.com; do
            echo "Verifying https://$domain/ is serving HTTP 200..."
            for i in 1 2 3; do
              status=$(curl -s -o /dev/null -w "%{http_code}" "https://$domain/" || echo "000")
              echo "$domain attempt $i: HTTP $status"
              if [ "$status" = "200" ]; then
                break
              fi
              if [ "$i" = "3" ]; then
                echo "$domain did not return 200 after 3 tries"
                exit 1
              fi
              sleep 5
            done
          done
